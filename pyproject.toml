[project]
name = "fraudgraph-ai"
version = "0.1.0"
description = "Graph-based financial fraud detection using transaction networks and machine learning."
authors = [
    { name = "Somyadeep Tarat" }
]
readme = "README.md"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]